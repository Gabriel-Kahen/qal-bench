name: Release Verification

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag or commit to verify"
        required: true
        default: "v0.3.0"

permissions:
  contents: read

jobs:
  release-verify:
    name: release-verify
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run full release verifier
        run: scripts/verify_release_artifacts.sh
