name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Verify resource-kernel artifact
        run: python scripts/verify_qalbench_results.py

      - name: Smoke-test population artifact writer
        run: |
          python scripts/run_qalbench_population.py \
            --seed-count 1 \
            --steps 2 \
            --initial-population 6 \
            --carrying-capacity 14 \
            --lineage-null-permutations 2 \
            --output-dir /tmp/qalbench-population-smoke \
            --no-figures
          test -f /tmp/qalbench-population-smoke/qalbench_population_individuals.csv.xz
          test -f /tmp/qalbench-population-smoke/qalbench_population_birth_events.csv.xz
          test -f /tmp/qalbench-population-smoke/qalbench_population_attempts.csv.xz
